<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div id="start-screen">
      <h1>TETRIS</h1>
      <h2>
        ⬅️ turn left <br />➡️ turn right <br />⬇️ speed up <br />
        Ⓡ rotate<br />🅿️ pause
      </h2>
      <button id="start-btn">START</button>
    </div>
    <div id="game-wrapper">
      <div id="game-screen"></div>
      <div id="sidebar">
        <div id="game-score">
          score
          <span id="score-number">0</span>
        </div>
        <div id="game-level">
          level
          <span id="level-number">0</span>
        </div>
        <div id="game-pause">pause</div>
      </div>
    </div>

    <div id="finish-screen">
      GAME OVER
      <br />
      <div id="restart-btn">RESTART</div>
    </div>

    <script src="./js/game.js"></script>
    <script src="./js/figure.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
